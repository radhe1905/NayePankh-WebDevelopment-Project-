    <section class="page-hero">

        <h1>Become a Volunteer</h1>

        <p>

            Join us and help make a positive impact in society.

        </p>

    </section>



    <section class="volunteer-section">

        <form id="volunteerForm">

            <h2>Volunteer Registration</h2>


            <input type="text" id="name" placeholder="Enter Your Full Name" required>


            <input type="email" id="email" placeholder="Enter Your Email" required>


            <input type="tel" id="phone" placeholder="Enter Your Phone Number" required>


            <input type="text" id="college" placeholder="College / Organization">


            <input type="text" id="skills" placeholder="Your Skills">


            <textarea id="reason" rows="5" placeholder="Why do you want to volunteer?" required></textarea>


            <button type="submit">

                Submit Application

            </button>


            <p id="message"></p>

        </form>

    </section>
